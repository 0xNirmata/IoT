global:
  hosts:
    domain: 127.0.0.1.nip.io

  edition: ce


certmanager:
  install: false


prometheus:
  install: false


gitlab-runner:
  install: false


nginx-ingress:
  enabled: true


# Resource limits optimized for school machines
# Lower values = faster OOM errors, higher values = GitLab crashes

redis:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi


postgresql:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi


gitlab:
  webservice:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  
  sidekiq:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi


# Disable heavy components
gitaly:
  replicas: 1
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
