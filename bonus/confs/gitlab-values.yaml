global:
  hosts:
    domain: 127.0.0.1.nip.io

  edition: ce


certmanager:
  install: false


prometheus:
  install: false


gitlab-runner:
  install: false


nginx-ingress:
  enabled: true

# bajar la memoria de PostgreSQL,
# Redis y webservice para que no te tire abajo la máquina de la escuela
redis:
  resources:
    requests:
      memory: 256Mi


postgresql:
  resources:
    requests:
      memory: 256Mi


gitlab:
  webservice:
    resources:
      requests:
        memory: 512Mi