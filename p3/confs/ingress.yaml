apiVersion: networking.k8s.io/v1 
kind: Ingress 
metadata:   
  name: rmarcas-playground-ingress   
  namespace: dev 
spec:   
  rules:   
  - http:       
    paths:       
    - path: /         
      pathType: Prefix         
      backend:           
        service:             
          name: rmarcas-playground-service             
          port:               
            number: 8888